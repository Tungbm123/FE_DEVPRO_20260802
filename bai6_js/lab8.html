<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html va js</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .form {
            max-width: 600px;
            padding: 30px 50px 50px;
            margin: 100px auto;
            box-shadow: 0 0 5px #ccc;
            border-radius: 5px;
        }

        .row {
            margin-bottom: 15px;
        }

        .row label {
            margin-bottom: 10px;
            font-size: 18px;
            display: block;
        }

        .form-control {
            width: 100%;
            height: 36px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 5px 15px;
        }

        .form-control:focus {
            outline: unset;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }

        .error{
            color: red;
        }
    </style>


</head>

<body>
    <div class="form">
        <h2 id="title"><span><b>Dang nhap tai khoan</b></span></h2>
        <div class="row">
            <label for="">Username</label>
            <input type="text" name="username" class="form-control">
            <span class="error" id="error-username"></span>

        </div>

        <div class="row">
            <label for="">Password</label>
            <div class="input-group">
                <input type="password" name="password" class="form-control">

                <i class="fa-solid fa-eye-slash"></i>
            </div>

        </div>

        <button type="button" class="login">Dang nhap</button>
    </div>


    <script>
        /*
        Cac cach selector den ten doi tuogn html
        1. selector qua ten class
        2. Selector qua ten id
        3. Selector qua ten the html
        4. css selector
            - querySelector() -> luon tra ve 1 doi tuogn html cu the
            - querySelectorAll() -> luon tra ve duoi dang danh sach cac doi tuong html

        */
        let objs = document.getElementsByClassName('form-control'); //tra ve 1 mang cac doi tuogn co class la form-control
        let obj = document.getElementById('title'); //tra ve 1 doi tuong 
        let obj2 = document.getElementsByTagName('label'); // tra ve danh sach cac doi tuong co cung ten the label

        let obj3 = document.querySelectorAll('#title');
        let obj4 = document.querySelector('.form-control');
        console.log(obj4)

        /*
        Chu y:　Cac ham, phuogn thuc hoac cac thuoc tinh su dung voi 1 doi tuogn html cu the
        
        */
        /*
        1. Thay doi noi dung cua the html hoac lay noi dung do ra 
         1.1. Lay noi dung text va thay doi noi dung text
         1.2. Lay  noi dung hoac thay doi ca the html; dung outerHTML
        */
        // let contentTitle = obj.innerHTML;
        // obj.innerHTML = `<button onclick="alert('toi la tung')">Click me</button>`;

        // console.log(obj.innerHTML);

        let contentHTMLTitle = obj.outerHTML;
        console.log(obj.innerHTML)

        // thay doi noi dung bao gom the html dang chua cai id, class do
        // obj.outerHTML = "<h1><center>Dang nhap tai khoan</center></h1>";

        document.querySelector('i').addEventListener('click', function () {
            //selector den input password
            let password = document.querySelector('input[name="password"]');
            //lay gia tri thuoc tinh cua the html
            let typeInput = password.getAttribute('type');
            let icon = document.querySelector(".input-group i")
            if (typeInput == 'password') {
                //set thay doi hoac them moi gia tri cho thuoc tinh cua the html
                password.setAttribute("type", "text");
                this.className = "fa-regular fa-eye";
            } else {
                password.setAttribute("type", "password")
                this.className = "fa-solid fa-eye-slash";
            }
        })

        //Thay doi hoac them moi hoac get gia tri thuoc tinh css
        //1.thay doi hoac them moi thuoc tinh css
        obj.style.textAlign = "center";
        obj.style.color = "brown";
        obj.style.fontSize = "35px";

        //Lay gia tri thuoc tinh css
        let fontSize = obj.style.FontSize;

        //Set hoac get gia tri input trong form
        /*
        1 so event hay dung:
            1. con tro chuot
                1. onClick -> Khi click chuot vao doi tuong html
                2. ondbClick -> Khi click chuot 2 lan lien tiep vao doi tuong html
                3. onmouseup -> Khi nhan phim chuot va nha nay len
                4. onmousedown -> Khi nhan phim chuot xuong
                5. onmouseover -> giong su kien hover trong css
                6. onmouseout -> khi roi con tro chuot khoi vung cua doi tuong html
            2. Su kien ban phim
                1. onkeyup -> khi nha nhay phim len
                2. onkeydown -> khi nhan phim xuong
                3. onkeypress -> khi hoan thanh thao tac phim

            3. su kien load trang -> thuogn su dung cho the body
                1. onload -> su kien xem trang html load xong chua
                2. 
        */
        document.querySelector('input[name="username"]').addEventListener('keyup', function () {
            //lay gia tri the inpou trong form
            let username = document.querySelector('input[name="username"]').value;
            if (username == '') {
                let error = document.getElementById('error-username').innerHTML= "vui long nhap tai khoan dang nhap"
            } else {
                let error = document.getElementById('error-username').innerHTML= ""
            }

            //set gia tri
            document.querySelector('input[name="username"]').value = 'tungbm@gmail.com';
        })



    </script>

</body>

</html>
